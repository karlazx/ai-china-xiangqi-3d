<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圣光大教堂 · 3D 中国象棋</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Serif SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
    <!-- Material Symbols Rounded -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --md-surface: rgba(250, 244, 232, 0.88);
            --md-border: rgba(180, 138, 68, 0.38);
            --md-text-primary: #2d2215;
            --md-gold-accent: #b8862d;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #241c14;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--md-text-primary);
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Material Design 3 Warm Ivory & Gold Glassmorphic Bar */
        .m3-bar {
            background: var(--md-surface);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--md-border);
            box-shadow: 0 10px 32px -4px rgba(28, 19, 8, 0.38), 0 1px 0 rgba(255, 255, 255, 0.7) inset;
        }

        .m3-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: #4a3720;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(180, 138, 68, 0.24);
        }

        .m3-btn:hover:not(:disabled) {
            background: rgba(235, 214, 172, 0.65);
            color: #23180b;
            border-color: rgba(180, 138, 68, 0.5);
        }

        .m3-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .m3-btn.active {
            background: linear-gradient(135deg, #efd59e 0%, #dfc07f 100%);
            color: #2b1d09;
            border: 1px solid rgba(163, 118, 42, 0.65);
            box-shadow: 0 2px 8px rgba(180, 134, 45, 0.25);
        }

        .m3-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        @keyframes checkPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(217, 45, 32, 0.55); }
            50% { box-shadow: 0 0 16px 4px rgba(217, 45, 32, 0.35); }
        }

        .check-alert {
            animation: checkPulse 1.5s infinite;
            border-color: #d92d20 !important;
            background: rgba(254, 228, 226, 0.95) !important;
            color: #912018 !important;
        }

        .calligraphy {
            font-family: 'Noto Serif SC', serif;
        }

        /* Subtle warm framing vignette */
        .cathedral-vignette {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 64%, rgba(20, 14, 8, 0.42) 100%);
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas -->
    <div id="canvas-container"></div>

    <!-- Subtle Warm Vignette -->
    <div class="cathedral-vignette"></div>

    <!-- Single-Level Material Design 3 Navigation Bar -->
    <header class="fixed top-3 left-1/2 -translate-x-1/2 z-20 w-[96vw] max-w-6xl pointer-events-none">
        <nav aria-label="主控制栏" class="m3-bar pointer-events-auto rounded-full px-3.5 py-2 sm:px-5 sm:py-2.5 flex flex-wrap items-center justify-between gap-2">
            
            <!-- Left: Brand & Dynamic Turn/Check Status Pill -->
            <div class="flex items-center gap-2.5">
                <div class="hidden md:flex items-center gap-2 pl-1 pr-3 border-r border-amber-900/15">
                    <span class="material-symbols-rounded text-[#9c6b19] text-xl">church</span>
                    <span class="calligraphy font-black tracking-wider text-sm text-[#382711]">圣光大教堂 · 象棋</span>
                </div>

                <!-- Turn & Game Status Indicator Pill -->
                <div id="status-pill" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#f3e7d0]/90 border border-amber-800/20 transition-all duration-300">
                    <span id="turn-dot" class="w-2.5 h-2.5 rounded-full bg-red-600 shadow-[0_0_8px_#dc2626] transition-colors duration-300"></span>
                    <span id="status-text" class="text-xs sm:text-sm font-bold tracking-wide text-[#2d2010] whitespace-nowrap">红方行棋 (玫瑰白玉)</span>
                    <span id="captured-summary" class="hidden lg:inline-block text-[11px] font-semibold text-amber-900/70 pl-2 border-l border-amber-900/15">红 16 · 黑 16</span>
                </div>
            </div>

            <!-- Right: All Direct Single-Level Action Controls -->
            <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-end">
                
                <!-- Mode Toggle: Player vs AI / 2P Pass & Play -->
                <button id="btn-mode" class="m3-btn active px-3.5 py-1.5 text-xs sm:text-sm" title="切换人机对战或双人同屏模式">
                    <span id="icon-mode" class="material-symbols-rounded text-[18px]">smart_toy</span>
                    <span id="label-mode">人机对战 (AI)</span>
                </button>

                <!-- Camera Preset Cycle: Sanctuary Isometric / Top-Down / Grand Panorama -->
                <button id="btn-camera" class="m3-btn px-3.5 py-1.5 text-xs sm:text-sm" title="切换视角：圣坛斜视 / 垂直俯视 / 圣殿全景">
                    <span class="material-symbols-rounded text-[18px]">videocam</span>
                    <span id="label-camera" class="hidden sm:inline">圣坛斜视</span>
                </button>

                <!-- Undo Move -->
                <button id="btn-undo" class="m3-btn px-3 py-1.5 text-xs sm:text-sm" disabled title="悔棋">
                    <span class="material-symbols-rounded text-[18px]">undo</span>
                    <span class="hidden sm:inline">悔棋</span>
                </button>

                <!-- New Game -->
                <button id="btn-new" class="m3-btn px-3 py-1.5 text-xs sm:text-sm" title="重新开局">
                    <span class="material-symbols-rounded text-[18px]">restart_alt</span>
                    <span class="hidden sm:inline">新局</span>
                </button>

                <!-- Sound Toggle -->
                <button id="btn-sound" class="m3-btn active p-1.5 sm:px-2.5 sm:py-1.5 text-xs sm:text-sm" title="开关圣殿环境与落子音效">
                    <span id="icon-sound" class="material-symbols-rounded text-[18px]">volume_up</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Non-intrusive Bottom Toast Banner -->
    <div id="toast-banner" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-all duration-500 opacity-0 translate-y-4">
        <div class="m3-bar rounded-full px-5 py-2.5 flex items-center gap-2.5 border border-amber-700/40">
            <span id="toast-icon" class="material-symbols-rounded text-[#9c6b19]">auto_awesome</span>
            <span id="toast-message" class="calligraphy text-sm sm:text-base font-bold tracking-wider text-[#2d2010]">将军！</span>
        </div>
    </div>

    <script>
        /**************************************************************************
         * 1. WEB AUDIO SYNTHESIZER (Stone Slide, Impact Shockwave, Shatter, Chime)
         **************************************************************************/
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.enabled) this.playSelect();
                return this.enabled;
            }

            playSelect() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(540, now);
                osc.frequency.exponentialRampToValueAtTime(810, now + 0.13);

                gain.gain.setValueAtTime(0.11, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.16);
            }

            playMove() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.25;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.11));
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(340, now);
                filter.frequency.linearRampToValueAtTime(200, now + 0.22);
                filter.Q.value = 2.4;

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.16, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);
                noise.start(now);

                const thud = this.ctx.createOscillator();
                const thudGain = this.ctx.createGain();
                thud.type = 'triangle';
                thud.frequency.setValueAtTime(140, now + 0.16);
                thud.frequency.exponentialRampToValueAtTime(45, now + 0.34);

                thudGain.gain.setValueAtTime(0.001, now);
                thudGain.gain.setValueAtTime(0.3, now + 0.16);
                thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

                thud.connect(thudGain);
                thudGain.connect(this.ctx.destination);
                thud.start(now + 0.16);
                thud.stop(now + 0.37);
            }

            playAttackAndShatter() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const impactTime = now + 0.25;

                const sub = this.ctx.createOscillator();
                const subGain = this.ctx.createGain();
                sub.type = 'sine';
                sub.frequency.setValueAtTime(165, impactTime);
                sub.frequency.exponentialRampToValueAtTime(30, impactTime + 0.45);

                subGain.gain.setValueAtTime(0.52, impactTime);
                subGain.gain.exponentialRampToValueAtTime(0.001, impactTime + 0.48);

                sub.connect(subGain);
                subGain.connect(this.ctx.destination);
                sub.start(impactTime);
                sub.stop(impactTime + 0.5);

                const freqs = [1150, 1520, 1920, 980, 2280, 1650, 820];
                freqs.forEach((f, idx) => {
                    const delay = impactTime + 0.02 + idx * 0.042 + Math.random() * 0.025;
                    const shardOsc = this.ctx.createOscillator();
                    const shardGain = this.ctx.createGain();
                    shardOsc.type = idx % 2 === 0 ? 'triangle' : 'sine';
                    shardOsc.frequency.setValueAtTime(f, delay);
                    shardOsc.frequency.exponentialRampToValueAtTime(f * 0.65, delay + 0.12);

                    shardGain.gain.setValueAtTime(0.11 / (1 + idx * 0.25), delay);
                    shardGain.gain.exponentialRampToValueAtTime(0.001, delay + 0.13);

                    shardOsc.connect(shardGain);
                    shardGain.connect(this.ctx.destination);
                    shardOsc.start(delay);
                    shardOsc.stop(delay + 0.14);
                });
            }

            playCathedralBell(isMate = false) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const notes = isMate ? [261.63, 329.63, 392.00, 523.25] : [329.63, 493.88];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.11);

                    gain.gain.setValueAtTime(0.16, now + i * 0.11);
                    gain.gain.exponentialRampToValueAtTime(0.0008, now + i * 0.11 + 1.7);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.11);
                    osc.stop(now + i * 0.11 + 1.75);
                });
            }
        }

        const sound = new SoundEngine();

        /**************************************************************************
         * 2. COMPLETE XIANGQI (CHINESE CHESS) RULES ENGINE & ALPHA-BETA AI
         **************************************************************************/
        const RED = 'r';
        const BLACK = 'b';

        const PIECE_INFO = {
            K: { rName: '帥', bName: '將', value: 10000 },
            A: { rName: '仕', bName: '士', value: 130   },
            E: { rName: '相', bName: '象', value: 130   },
            R: { rName: '俥', bName: '車', value: 600   },
            H: { rName: '傌', bName: '馬', value: 290   },
            C: { rName: '炮', bName: '砲', value: 300   },
            P: { rName: '兵', bName: '卒', value: 80    }
        };

        class XiangqiEngine {
            constructor() {
                this.reset();
            }

            reset() {
                this.board = Array.from({ length: 10 }, () => Array(9).fill(null));
                this.turn = RED;
                this.history = [];
                this.gameOver = false;
                this.winner = null;

                const setupRow = (row, color, types) => {
                    types.forEach((type, col) => {
                        if (type) {
                            this.board[row][col] = {
                                id: `${color}_${type}_${row}_${col}_${Math.random().toString(36).slice(2, 6)}`,
                                type,
                                color
                            };
                        }
                    });
                };

                setupRow(0, BLACK, ['R', 'H', 'E', 'A', 'K', 'A', 'E', 'H', 'R']);
                setupRow(2, BLACK, [null, 'C', null, null, null, null, null, 'C', null]);
                setupRow(3, BLACK, ['P', null, 'P', null, 'P', null, 'P', null, 'P']);

                setupRow(6, RED, ['P', null, 'P', null, 'P', null, 'P', null, 'P']);
                setupRow(7, RED, [null, 'C', null, null, null, null, null, 'C', null]);
                setupRow(9, RED, ['R', 'H', 'E', 'A', 'K', 'A', 'E', 'H', 'R']);
            }

            inBounds(r, c) {
                return r >= 0 && r < 10 && c >= 0 && c < 9;
            }

            inPalace(r, c, color) {
                if (c < 3 || c > 5) return false;
                return color === RED ? (r >= 7 && r <= 9) : (r >= 0 && r <= 2);
            }

            getPseudoMoves(r, c, board = this.board) {
                const piece = board[r][c];
                if (!piece) return [];
                const { type, color } = piece;
                const moves = [];

                const addIfValid = (nr, nc) => {
                    if (!this.inBounds(nr, nc)) return false;
                    const target = board[nr][nc];
                    if (!target || target.color !== color) {
                        moves.push({ fromR: r, fromC: c, toR: nr, toC: nc, captured: target });
                    }
                    return !target;
                };

                if (type === 'K') {
                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (const [dr, dc] of dirs) {
                        const nr = r + dr, nc = c + dc;
                        if (this.inPalace(nr, nc, color)) addIfValid(nr, nc);
                    }
                } else if (type === 'A') {
                    const dirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
                    for (const [dr, dc] of dirs) {
                        const nr = r + dr, nc = c + dc;
                        if (this.inPalace(nr, nc, color)) addIfValid(nr, nc);
                    }
                } else if (type === 'E') {
                    const dirs = [[-2, -2], [-2, 2], [2, -2], [2, 2]];
                    for (const [dr, dc] of dirs) {
                        const nr = r + dr, nc = c + dc;
                        const eyeR = r + dr / 2, eyeC = c + dc / 2;
                        if (!this.inBounds(nr, nc)) continue;
                        if (color === RED && nr < 5) continue;
                        if (color === BLACK && nr > 4) continue;
                        if (board[eyeR][eyeC] === null) addIfValid(nr, nc);
                    }
                } else if (type === 'H') {
                    const jumps = [
                        { leg: [-1, 0], to: [-2, -1] }, { leg: [-1, 0], to: [-2, 1] },
                        { leg: [1, 0],  to: [2, -1] },  { leg: [1, 0],  to: [2, 1] },
                        { leg: [0, -1], to: [-1, -2] }, { leg: [0, -1], to: [1, -2] },
                        { leg: [0, 1],  to: [-1, 2] },  { leg: [0, 1],  to: [1, 2] }
                    ];
                    for (const j of jumps) {
                        const legR = r + j.leg[0], legC = c + j.leg[1];
                        const nr = r + j.to[0], nc = c + j.to[1];
                        if (this.inBounds(nr, nc) && board[legR][legC] === null) {
                            addIfValid(nr, nc);
                        }
                    }
                } else if (type === 'R') {
                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (const [dr, dc] of dirs) {
                        let nr = r + dr, nc = c + dc;
                        while (this.inBounds(nr, nc)) {
                            if (!addIfValid(nr, nc)) break;
                            nr += dr;
                            nc += dc;
                        }
                    }
                } else if (type === 'C') {
                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (const [dr, dc] of dirs) {
                        let nr = r + dr, nc = c + dc;
                        let jumped = false;
                        while (this.inBounds(nr, nc)) {
                            const target = board[nr][nc];
                            if (!jumped) {
                                if (!target) {
                                    moves.push({ fromR: r, fromC: c, toR: nr, toC: nc, captured: null });
                                } else {
                                    jumped = true;
                                }
                            } else {
                                if (target) {
                                    if (target.color !== color) {
                                        moves.push({ fromR: r, fromC: c, toR: nr, toC: nc, captured: target });
                                    }
                                    break;
                                }
                            }
                            nr += dr;
                            nc += dc;
                        }
                    }
                } else if (type === 'P') {
                    const forward = color === RED ? -1 : 1;
                    addIfValid(r + forward, c);
                    const crossedRiver = color === RED ? (r <= 4) : (r >= 5);
                    if (crossedRiver) {
                        addIfValid(r, c - 1);
                        addIfValid(r, c + 1);
                    }
                }

                return moves;
            }

            generalsFacing(board) {
                let rGeneral = null, bGeneral = null;
                for (let r = 0; r < 10; r++) {
                    for (let c = 3; c <= 5; c++) {
                        const p = board[r][c];
                        if (p && p.type === 'K') {
                            if (p.color === RED) rGeneral = { r, c };
                            else bGeneral = { r, c };
                        }
                    }
                }
                if (!rGeneral || !bGeneral || rGeneral.c !== bGeneral.c) return false;
                const col = rGeneral.c;
                for (let r = bGeneral.r + 1; r < rGeneral.r; r++) {
                    if (board[r][col] !== null) return false;
                }
                return true;
            }

            isInCheck(color, board = this.board) {
                if (this.generalsFacing(board)) return true;

                let kingPos = null;
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 9; c++) {
                        const p = board[r][c];
                        if (p && p.color === color && p.type === 'K') {
                            kingPos = { r, c };
                            break;
                        }
                    }
                    if (kingPos) break;
                }
                if (!kingPos) return true;

                const enemy = color === RED ? BLACK : RED;
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 9; c++) {
                        const p = board[r][c];
                        if (p && p.color === enemy) {
                            const moves = this.getPseudoMoves(r, c, board);
                            for (const m of moves) {
                                if (m.toR === kingPos.r && m.toC === kingPos.c) return true;
                            }
                        }
                    }
                }
                return false;
            }

            getLegalMovesForPiece(r, c) {
                const piece = this.board[r][c];
                if (!piece) return [];
                const pseudo = this.getPseudoMoves(r, c, this.board);
                const legal = [];

                for (const m of pseudo) {
                    const savedTarget = this.board[m.toR][m.toC];
                    this.board[m.toR][m.toC] = piece;
                    this.board[m.fromR][m.fromC] = null;

                    const inCheck = this.isInCheck(piece.color, this.board);

                    this.board[m.fromR][m.fromC] = piece;
                    this.board[m.toR][m.toC] = savedTarget;

                    if (!inCheck) legal.push(m);
                }
                return legal;
            }

            getAllLegalMoves(color) {
                const all = [];
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 9; c++) {
                        const p = this.board[r][c];
                        if (p && p.color === color) {
                            all.push(...this.getLegalMovesForPiece(r, c));
                        }
                    }
                }
                return all;
            }

            makeMove(move) {
                const piece = this.board[move.fromR][move.fromC];
                const captured = this.board[move.toR][move.toC];

                this.history.push({
                    fromR: move.fromR,
                    fromC: move.fromC,
                    toR: move.toR,
                    toC: move.toC,
                    piece,
                    captured,
                    prevTurn: this.turn
                });

                this.board[move.toR][move.toC] = piece;
                this.board[move.fromR][move.fromC] = null;
                this.turn = this.turn === RED ? BLACK : RED;

                const nextMoves = this.getAllLegalMoves(this.turn);
                const inCheck = this.isInCheck(this.turn);

                if (nextMoves.length === 0) {
                    this.gameOver = true;
                    this.winner = this.turn === RED ? BLACK : RED;
                }

                return { piece, captured, inCheck, gameOver: this.gameOver, winner: this.winner };
            }

            undoLastMove() {
                if (this.history.length === 0) return null;
                const last = this.history.pop();
                this.board[last.fromR][last.fromC] = last.piece;
                this.board[last.toR][last.toC] = last.captured;
                this.turn = last.prevTurn;
                this.gameOver = false;
                this.winner = null;
                return last;
            }

            evaluateBoard() {
                let score = 0;
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 9; c++) {
                        const p = this.board[r][c];
                        if (!p) continue;
                        let val = PIECE_INFO[p.type].value;
                        if (p.type === 'P') {
                            if (p.color === BLACK && r >= 5) val += 55 + (c >= 2 && c <= 6 ? 20 : 0);
                            if (p.color === RED && r <= 4) val += 55 + (c >= 2 && c <= 6 ? 20 : 0);
                        } else if (p.type === 'H' || p.type === 'C' || p.type === 'R') {
                            val += (4 - Math.abs(4 - c)) * 6;
                        }
                        score += (p.color === BLACK ? val : -val);
                    }
                }
                return score;
            }

            computeBestMove(depth = 3) {
                const legalMoves = this.getAllLegalMoves(BLACK);
                if (legalMoves.length === 0) return null;

                legalMoves.sort((a, b) => {
                    const va = a.captured ? PIECE_INFO[a.captured.type].value : 0;
                    const vb = b.captured ? PIECE_INFO[b.captured.type].value : 0;
                    return vb - va;
                });

                let bestMove = legalMoves[0];
                let bestScore = -Infinity;
                let alpha = -Infinity;
                let beta = Infinity;

                for (const m of legalMoves) {
                    const piece = this.board[m.fromR][m.fromC];
                    const captured = this.board[m.toR][m.toC];

                    this.board[m.toR][m.toC] = piece;
                    this.board[m.fromR][m.fromC] = null;

                    const score = this.alphaBeta(depth - 1, alpha, beta, false);

                    this.board[m.fromR][m.fromC] = piece;
                    this.board[m.toR][m.toC] = captured;

                    const jitter = (Math.random() - 0.5) * 4;
                    if (score + jitter > bestScore) {
                        bestScore = score + jitter;
                        bestMove = m;
                    }
                    alpha = Math.max(alpha, score);
                }
                return bestMove;
            }

            alphaBeta(depth, alpha, beta, isMaximizing) {
                if (depth === 0) return this.evaluateBoard();

                const color = isMaximizing ? BLACK : RED;
                const moves = this.getAllLegalMoves(color);
                if (moves.length === 0) {
                    return isMaximizing ? -99999 - depth * 100 : 99999 + depth * 100;
                }

                moves.sort((a, b) => {
                    const va = a.captured ? PIECE_INFO[a.captured.type].value : 0;
                    const vb = b.captured ? PIECE_INFO[b.captured.type].value : 0;
                    return vb - va;
                });

                if (isMaximizing) {
                    let maxEval = -Infinity;
                    for (const m of moves) {
                        const piece = this.board[m.fromR][m.fromC];
                        const captured = this.board[m.toR][m.toC];
                        this.board[m.toR][m.toC] = piece;
                        this.board[m.fromR][m.fromC] = null;

                        const evaluation = this.alphaBeta(depth - 1, alpha, beta, false);

                        this.board[m.fromR][m.fromC] = piece;
                        this.board[m.toR][m.toC] = captured;

                        maxEval = Math.max(maxEval, evaluation);
                        alpha = Math.max(alpha, evaluation);
                        if (beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (const m of moves) {
                        const piece = this.board[m.fromR][m.fromC];
                        const captured = this.board[m.toR][m.toC];
                        this.board[m.toR][m.toC] = piece;
                        this.board[m.fromR][m.fromC] = null;

                        const evaluation = this.alphaBeta(depth - 1, alpha, beta, true);

                        this.board[m.fromR][m.fromC] = piece;
                        this.board[m.toR][m.toC] = captured;

                        minEval = Math.min(minEval, evaluation);
                        beta = Math.min(beta, evaluation);
                        if (beta <= alpha) break;
                    }
                    return minEval;
                }
            }
        }

        // Balanced Cathedral Environment Map for realistic metallic & clearcoat reflections without whiteout
        function createCathedralEnvMap(renderer) {
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileCubemapShader();

            const envScene = new THREE.Scene();
            envScene.background = new THREE.Color(0x3a2e21);

            // Warm vaulted ceiling glow
            const topLight = new THREE.Mesh(
                new THREE.SphereGeometry(20, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x5c4730, side: THREE.BackSide })
            );
            envScene.add(topLight);

            // Stained glass color accents for realistic specular highlights on marble & obsidian
            const accentColors = [0xd99b3c, 0xc24136, 0x3b82f6, 0x10b981, 0xf59e0b];
            accentColors.forEach((col, idx) => {
                const a = (idx / accentColors.length) * Math.PI * 2;
                const panel = new THREE.Mesh(
                    new THREE.PlaneGeometry(6, 10),
                    new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })
                );
                panel.position.set(Math.cos(a) * 14, 4, Math.sin(a) * 14);
                panel.lookAt(0, 0, 0);
                envScene.add(panel);
            });

            const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
            pmremGenerator.dispose();
            return envMap;
        }

        // Warm Limestone / Travertine Texture for Cathedral Columns & Walls
        function createWarmLimestoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#cbb899';
            ctx.fillRect(0, 0, 512, 512);

            // Ashlar masonry blocks
            ctx.strokeStyle = 'rgba(92, 73, 48, 0.28)';
            ctx.lineWidth = 2;
            const rowH = 64;
            for (let y = 0; y < 512; y += rowH) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(512, y);
                ctx.stroke();

                const offset = (y / rowH) % 2 === 0 ? 0 : 64;
                for (let x = offset; x < 512; x += 128) {
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x, y + rowH);
                    ctx.stroke();
                }
            }

            // Travertine mineral grain
            for (let i = 0; i < 6000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255, 248, 232, 0.12)' : 'rgba(74, 56, 35, 0.12)';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 2);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 4);
            return tex;
        }

        // Cathedral Marble Inlay Floor Texture (Rich Siena Gold, Rosso Verona & Warm Carrara)
        function createCathedralFloorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#cfc1ab';
            ctx.fillRect(0, 0, 1024, 1024);

            // Checkerboard diamond inlay tiles
            const step = 128;
            for (let y = 0; y < 1024; y += step) {
                for (let x = 0; x < 1024; x += step) {
                    const isAlt = ((x / step) + (y / step)) % 2 === 0;
                    ctx.fillStyle = isAlt ? '#d6c7b0' : '#b8a282';
                    ctx.fillRect(x, y, step, step);
                    ctx.strokeStyle = '#8c6d3f';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, step, step);
                }
            }

            // Central Octagonal Compass Rose Medallion
            const cx = 512, cy = 512;
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, 360, 0, Math.PI * 2);
            ctx.fillStyle = '#993d33'; // Rosso Verona marble ring
            ctx.fill();
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#b58938';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 310, 0, Math.PI * 2);
            ctx.fillStyle = '#dfd3be';
            ctx.fill();
            ctx.stroke();

            // 8-point Cathedral Star
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(a);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-42, -110);
                ctx.lineTo(0, -295);
                ctx.lineTo(42, -110);
                ctx.closePath();
                ctx.fillStyle = i % 2 === 0 ? '#b8862d' : '#7c2d26';
                ctx.fill();
                ctx.strokeStyle = '#4a3519';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(3, 3);
            tex.anisotropy = 4;
            return tex;
        }

        // High-Contrast Imperial Amber-Jade & Deep Bronze Inlaid Xiangqi Board Texture
        function createXiangqiBoardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1800;
            canvas.height = 2000;
            const ctx = canvas.getContext('2d');

            // 1. Warm Honey-Parchment / Imperial Onyx-Jade Stone Surface (Never washes out under light!)
            const grad = ctx.createRadialGradient(900, 1000, 120, 900, 1000, 1380);
            grad.addColorStop(0, '#e0cca8');
            grad.addColorStop(0.55, '#d2ba91');
            grad.addColorStop(1, '#bfa273');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle natural marble veining
            ctx.strokeStyle = 'rgba(120, 88, 42, 0.14)';
            ctx.lineWidth = 2.5;
            for (let i = 0; i < 28; i++) {
                ctx.beginPath();
                let x = Math.random() * 1800;
                let y = 0;
                ctx.moveTo(x, y);
                while (y < 2000) {
                    x += (Math.random() - 0.5) * 90;
                    y += 60 + Math.random() * 80;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const marginX = 180;
            const marginY = 180;
            const cellW = (canvas.width - marginX * 2) / 8;
            const cellH = (canvas.height - marginY * 2) / 9;

            // Outer Decorative Dark Bronze & Crimson Double Frame
            ctx.strokeStyle = '#3d2610';
            ctx.lineWidth = 14;
            ctx.strokeRect(marginX - 42, marginY - 42, cellW * 8 + 84, cellH * 9 + 84);

            ctx.strokeStyle = '#8c2d22';
            ctx.lineWidth = 5;
            ctx.strokeRect(marginX - 58, marginY - 58, cellW * 8 + 116, cellH * 9 + 116);

            // Chu River / Han Border Recessed Band
            const riverY = marginY + 4 * cellH;
            const riverGrad = ctx.createLinearGradient(marginX, riverY, marginX, riverY + cellH);
            riverGrad.addColorStop(0, 'rgba(92, 64, 32, 0.28)');
            riverGrad.addColorStop(0.5, 'rgba(74, 50, 24, 0.38)');
            riverGrad.addColorStop(1, 'rgba(92, 64, 32, 0.28)');
            ctx.fillStyle = riverGrad;
            ctx.fillRect(marginX, riverY, cellW * 8, cellH);

            // High-Contrast Deep Antique Bronze Grid Lines
            ctx.strokeStyle = '#3b240e';
            ctx.lineWidth = 7;
            ctx.lineCap = 'square';

            // Horizontal lines (10 rows)
            for (let r = 0; r < 10; r++) {
                const y = marginY + r * cellH;
                ctx.beginPath();
                ctx.moveTo(marginX, y);
                ctx.lineTo(marginX + 8 * cellW, y);
                ctx.stroke();
            }

            // Vertical lines (split across river except outer edges 0 and 8)
            for (let c = 0; c < 9; c++) {
                const x = marginX + c * cellW;
                if (c === 0 || c === 8) {
                    ctx.beginPath();
                    ctx.moveTo(x, marginY);
                    ctx.lineTo(x, marginY + 9 * cellH);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(x, marginY);
                    ctx.lineTo(x, marginY + 4 * cellH);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(x, marginY + 5 * cellH);
                    ctx.lineTo(x, marginY + 9 * cellH);
                    ctx.stroke();
                }
            }

            // Nine Palaces (九宫格) Diagonal Lines
            const drawPalace = (startRow) => {
                ctx.strokeStyle = '#592518';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(marginX + 3 * cellW, marginY + startRow * cellH);
                ctx.lineTo(marginX + 5 * cellW, marginY + (startRow + 2) * cellH);
                ctx.moveTo(marginX + 5 * cellW, marginY + startRow * cellH);
                ctx.lineTo(marginX + 3 * cellW, marginY + (startRow + 2) * cellH);
                ctx.stroke();
            };
            drawPalace(0);
            drawPalace(7);

            // Fiducial L-marks at Cannon and Soldier points
            ctx.strokeStyle = '#3b240e';
            ctx.lineWidth = 5.5;
            const drawCrossMark = (r, c) => {
                const cx = marginX + c * cellW;
                const cy = marginY + r * cellH;
                const offset = 15;
                const len = 28;
                [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([qx, qy]) => {
                    if (c === 0 && qx < 0) return;
                    if (c === 8 && qx > 0) return;
                    ctx.beginPath();
                    ctx.moveTo(cx + qx * offset, cy + qy * (offset + len));
                    ctx.lineTo(cx + qx * offset, cy + qy * offset);
                    ctx.lineTo(cx + qx * (offset + len), cy + qy * offset);
                    ctx.stroke();
                });
            };

            [
                [2, 1], [2, 7], [7, 1], [7, 7],
                [3, 0], [3, 2], [3, 4], [3, 6], [3, 8],
                [6, 0], [6, 2], [6, 4], [6, 6], [6, 8]
            ].forEach(([r, c]) => drawCrossMark(r, c));

            // Engraved Calligraphy in River: 楚 河 · 漢 界
            ctx.save();
            ctx.fillStyle = '#422810';
            ctx.font = '900 82px "Noto Serif SC", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const riverCenterY = riverY + cellH / 2;
            ctx.fillText('楚 河', marginX + cellW * 2, riverCenterY);
            ctx.fillText('漢 界', marginX + cellW * 6, riverCenterY);

            // Center gothic rosette medallion in river
            ctx.strokeStyle = '#6b441b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(marginX + cellW * 4, riverCenterY, 42, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 8;
            return texture;
        }

        // High-Contrast Piece Top Medallion Textures

                // Deep Volcanic Obsidian with Luminous Cyan-Gold Runes

                bg.addColorStop(0.6, '#121620');
                bg.addColorStop(1, '#080a0f');

                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(256, 256, 192, 0, Math.PI * 2);

                ctx.fillStyle = '#f0f9ff';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 18;
                ctx.font = '900 255px "Noto Serif SC", serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char, 256, 266);

            const tex = new THREE.CanvasTexture(canvas);

        // Stained Glass Rose Window Texture
