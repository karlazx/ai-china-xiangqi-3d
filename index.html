<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圣光大教堂 · 3D 中国象棋</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Serif SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
    <!-- Material Symbols Rounded -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --md-surface: rgba(250, 244, 232, 0.88);
            --md-border: rgba(180, 138, 68, 0.38);
            --md-text-primary: #2d2215;
            --md-gold-accent: #b8862d;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #241c14;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--md-text-primary);
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Material Design 3 Warm Ivory & Gold Glassmorphic Bar */
        .m3-bar {
            background: var(--md-surface);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--md-border);
            box-shadow: 0 10px 32px -4px rgba(28, 19, 8, 0.38), 0 1px 0 rgba(255, 255, 255, 0.7) inset;
        }

        .m3-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: #4a3720;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(180, 138, 68, 0.24);
        }

        .m3-btn:hover:not(:disabled) {
            background: rgba(235, 214, 172, 0.65);
            color: #23180b;
            border-color: rgba(180, 138, 68, 0.5);
        }

        .m3-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .m3-btn.active {
            background: linear-gradient(135deg, #efd59e 0%, #dfc07f 100%);
            color: #2b1d09;
            border: 1px solid rgba(163, 118, 42, 0.65);
            box-shadow: 0 2px 8px rgba(180, 134, 45, 0.25);
        }

        .m3-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        @keyframes checkPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(217, 45, 32, 0.55); }
            50% { box-shadow: 0 0 16px 4px rgba(217, 45, 32, 0.35); }
        }

        .check-alert {
            animation: checkPulse 1.5s infinite;
            border-color: #d92d20 !important;
            background: rgba(254, 228, 226, 0.95) !important;
            color: #912018 !important;
        }

        .calligraphy {
            font-family: 'Noto Serif SC', serif;
        }

        /* Subtle warm framing vignette */
        .cathedral-vignette {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 64%, rgba(20, 14, 8, 0.42) 100%);
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas -->
    <div id="canvas-container"></div>

    <!-- Subtle Warm Vignette -->
    <div class="cathedral-vignette"></div>

    <!-- Single-Level Material Design 3 Navigation Bar -->
    <header class="fixed top-3 left-1/2 -translate-x-1/2 z-20 w-[96vw] max-w-6xl pointer-events-none">
        <nav aria-label="主控制栏" class="m3-bar pointer-events-auto rounded-full px-3.5 py-2 sm:px-5 sm:py-2.5 flex flex-wrap items-center justify-between gap-2">
            
            <!-- Left: Brand & Dynamic Turn/Check Status Pill -->
            <div class="flex items-center gap-2.5">
                <div class="hidden md:flex items-center gap-2 pl-1 pr-3 border-r border-amber-900/15">
                    <span class="material-symbols-rounded text-[#9c6b19] text-xl">church</span>
                    <span class="calligraphy font-black tracking-wider text-sm text-[#382711]">圣光大教堂 · 象棋</span>
                </div>

                <!-- Turn & Game Status Indicator Pill -->
                <div id="status-pill" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#f3e7d0]/90 border border-amber-800/20 transition-all duration-300">
                    <span id="turn-dot" class="w-2.5 h-2.5 rounded-full bg-red-600 shadow-[0_0_8px_#dc2626] transition-colors duration-300"></span>
                    <span id="status-text" class="text-xs sm:text-sm font-bold tracking-wide text-[#2d2010] whitespace-nowrap">红方行棋 (玫瑰白玉)</span>
                    <span id="captured-summary" class="hidden lg:inline-block text-[11px] font-semibold text-amber-900/70 pl-2 border-l border-amber-900/15">红 16 · 黑 16</span>
                </div>
            </div>

            <!-- Right: All Direct Single-Level Action Controls -->
            <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-end">
                
                <!-- Mode Toggle: Player vs AI / 2P Pass & Play -->
                <button id="btn-mode" class="m3-btn active px-3.5 py-1.5 text-xs sm:text-sm" title="切换人机对战或双人同屏模式">
                    <span id="icon-mode" class="material-symbols-rounded text-[18px]">smart_toy</span>
                    <span id="label-mode">人机对战 (AI)</span>
                </button>

                <!-- Camera Preset Cycle: Sanctuary Isometric / Top-Down / Grand Panorama -->
                <button id="btn-camera" class="m3-btn px-3.5 py-1.5 text-xs sm:text-sm" title="切换视角：圣坛斜视 / 垂直俯视 / 圣殿全景">
                    <span class="material-symbols-rounded text-[18px]">videocam</span>
                    <span id="label-camera" class="hidden sm:inline">圣坛斜视</span>
                </button>

                <!-- Undo Move -->
                <button id="btn-undo" class="m3-btn px-3 py-1.5 text-xs sm:text-sm" disabled title="悔棋">
                    <span class="material-symbols-rounded text-[18px]">undo</span>
                    <span class="hidden sm:inline">悔棋</span>
                </button>

                <!-- New Game -->
                <button id="btn-new" class="m3-btn px-3 py-1.5 text-xs sm:text-sm" title="重新开局">
                    <span class="material-symbols-rounded text-[18px]">restart_alt</span>
                    <span class="hidden sm:inline">新局</span>
                </button>

                <!-- Sound Toggle -->
                <button id="btn-sound" class="m3-btn active p-1.5 sm:px-2.5 sm:py-1.5 text-xs sm:text-sm" title="开关圣殿环境与落子音效">
                    <span id="icon-sound" class="material-symbols-rounded text-[18px]">volume_up</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Non-intrusive Bottom Toast Banner -->
    <div id="toast-banner" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-all duration-500 opacity-0 translate-y-4">
        <div class="m3-bar rounded-full px-5 py-2.5 flex items-center gap-2.5 border border-amber-700/40">
            <span id="toast-icon" class="material-symbols-rounded text-[#9c6b19]">auto_awesome</span>
            <span id="toast-message" class="calligraphy text-sm sm:text-base font-bold tracking-wider text-[#2d2010]">将军！</span>
        </div>
    </div>

    <script>
        /**************************************************************************
         * 1. WEB AUDIO SYNTHESIZER (Stone Slide, Impact Shockwave, Shatter, Chime)
         **************************************************************************/
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.enabled) this.playSelect();
                return this.enabled;
            }

            playSelect() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(540, now);
                osc.frequency.exponentialRampToValueAtTime(810, now + 0.13);

                gain.gain.setValueAtTime(0.11, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.16);
            }

            playMove() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.25;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.11));
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(340, now);
                filter.frequency.linearRampToValueAtTime(200, now + 0.22);
                filter.Q.value = 2.4;
