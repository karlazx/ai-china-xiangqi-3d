<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圣光大教堂 · 3D 中国象棋</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Serif SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
    <!-- Material Symbols Rounded -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --md-surface: rgba(250, 244, 232, 0.88);
            --md-border: rgba(180, 138, 68, 0.38);
            --md-text-primary: #2d2215;
            --md-gold-accent: #b8862d;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #241c14;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--md-text-primary);
        }

        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Material Design 3 Warm Ivory & Gold Glassmorphic Bar */
        .m3-bar {
            background: var(--md-surface);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--md-border);
            box-shadow: 0 10px 32px -4px rgba(28, 19, 8, 0.38), 0 1px 0 rgba(255, 255, 255, 0.7) inset;
        }

        .m3-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: #4a3720;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(180, 138, 68, 0.24);
        }

        .m3-btn:hover:not(:disabled) {
            background: rgba(235, 214, 172, 0.65);
            color: #23180b;
            border-color: rgba(180, 138, 68, 0.5);
        }

        .m3-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .m3-btn.active {
            background: linear-gradient(135deg, #efd59e 0%, #dfc07f 100%);
            color: #2b1d09;
            border: 1px solid rgba(163, 118, 42, 0.65);
            box-shadow: 0 2px 8px rgba(180, 134, 45, 0.25);
        }

        .m3-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        @keyframes checkPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(217, 45, 32, 0.55); }
            50% { box-shadow: 0 0 16px 4px rgba(217, 45, 32, 0.35); }
        }

        .check-alert {
            animation: checkPulse 1.5s infinite;
            border-color: #d92d20 !important;
            background: rgba(254, 228, 226, 0.95) !important;
            color: #912018 !important;
        }

        .calligraphy {
            font-family: 'Noto Serif SC', serif;
        }

        /* Subtle warm framing vignette */
        .cathedral-vignette {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 64%, rgba(20, 14, 8, 0.42) 100%);
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas -->
    <div id="canvas-container"></div>

    <!-- Subtle Warm Vignette -->
    <div class="cathedral-vignette"></div>

    <!-- Single-Level Material Design 3 Navigation Bar -->
    <header class="fixed top-3 left-1/2 -translate-x-1/2 z-20 w-[96vw] max-w-6xl pointer-events-none">
        <nav aria-label="主控制栏" class="m3-bar pointer-events-auto rounded-full px-3.5 py-2 sm:px-5 sm:py-2.5 flex flex-wrap items-center justify-between gap-2">
            
            <!-- Left: Brand & Dynamic Turn/Check Status Pill -->
            <div class="flex items-center gap-2.5">
                <div class="hidden md:flex items-center gap-2 pl-1 pr-3 border-r border-amber-900/15">
                    <span class="material-symbols-rounded text-[#9c6b19] text-xl">church</span>
                    <span class="calligraphy font-black tracking-wider text-sm text-[#382711]">圣光大教堂 · 象棋</span>
                </div>

                <!-- Turn & Game Status Indicator Pill -->
                <div id="status-pill" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#f3e7d0]/90 border border-amber-800/20 transition-all duration-300">
                    <span id="turn-dot" class="w-2.5 h-2.5 rounded-full bg-red-600 shadow-[0_0_8px_#dc2626] transition-colors duration-300"></span>
                    <span id="status-text" class="text-xs sm:text-sm font-bold tracking-wide text-[#2d2010] whitespace-nowrap">红方行棋 (玫瑰白玉)</span>
                    <span id="captured-summary" class="hidden lg:inline-block text-[11px] font-semibold text-amber-900/70 pl-2 border-l border-amber-900/15">红 16 · 黑 16</span>
                </div>
            </div>

            <!-- Right: All Direct Single-Level Action Controls -->
            <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-end">
                
                <!-- Mode Toggle: Player vs AI / 2P Pass & Play -->
                <button id="btn-mode" class="m3-btn active px-3.5 py-1.5 text-xs sm:text-sm" title="切换人机对战或双人同屏模式">
                    <span id="icon-mode" class="material-symbols-rounded text-[18px]">smart_toy</span>
                    <span id="label-mode">人机对战 (AI)</span>
                </button>

                <!-- Camera Preset Cycle: Sanctuary Isometric / Top-Down / Grand Panorama -->
                <button id="btn-camera" class="m3-btn px-3.5 py-1.5 text-xs sm:text-sm" title="切换视角：圣坛斜视 / 垂直俯视 / 圣殿全景">
                    <span class="material-symbols-rounded text-[18px]">videocam</span>
                    <span id="label-camera" class="hidden sm:inline">圣坛斜视</span>
                </button>

                <!-- Undo Move -->
                <button id="btn-undo" class="m3-btn px-3 py-1.5 text-xs sm:text-sm" disabled title="悔棋">
                    <span class="material-symbols-rounded text-[18px]">undo</span>
                    <span class="hidden sm:inline">悔棋</span>
                </button>

                <!-- New Game -->
                <button id="btn-new" class="m3-btn px-3 py-1.5 text-xs sm:text-sm" title="重新开局">
                    <span class="material-symbols-rounded text-[18px]">restart_alt</span>
                    <span class="hidden sm:inline">新局</span>
                </button>

                <!-- Sound Toggle -->
                <button id="btn-sound" class="m3-btn active p-1.5 sm:px-2.5 sm:py-1.5 text-xs sm:text-sm" title="开关圣殿环境与落子音效">
                    <span id="icon-sound" class="material-symbols-rounded text-[18px]">volume_up</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Non-intrusive Bottom Toast Banner -->
    <div id="toast-banner" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-all duration-500 opacity-0 translate-y-4">
        <div class="m3-bar rounded-full px-5 py-2.5 flex items-center gap-2.5 border border-amber-700/40">
            <span id="toast-icon" class="material-symbols-rounded text-[#9c6b19]">auto_awesome</span>
            <span id="toast-message" class="calligraphy text-sm sm:text-base font-bold tracking-wider text-[#2d2010]">将军！</span>
        </div>
    </div>

    <script>
        /**************************************************************************
         * 1. WEB AUDIO SYNTHESIZER (Stone Slide, Impact Shockwave, Shatter, Chime)
         **************************************************************************/
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.enabled) this.playSelect();
                return this.enabled;
            }

            playSelect() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(540, now);
                osc.frequency.exponentialRampToValueAtTime(810, now + 0.13);

                gain.gain.setValueAtTime(0.11, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.16);
            }

            playMove() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.25;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.11));
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(340, now);
                filter.frequency.linearRampToValueAtTime(200, now + 0.22);
                filter.Q.value = 2.4;

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.16, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);
                noise.start(now);

                const thud = this.ctx.createOscillator();
                const thudGain = this.ctx.createGain();
                thud.type = 'triangle';
                thud.frequency.setValueAtTime(140, now + 0.16);
                thud.frequency.exponentialRampToValueAtTime(45, now + 0.34);

                thudGain.gain.setValueAtTime(0.001, now);
                thudGain.gain.setValueAtTime(0.3, now + 0.16);
                thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

                thud.connect(thudGain);
                thudGain.connect(this.ctx.destination);
                thud.start(now + 0.16);
                thud.stop(now + 0.37);
            }

            playAttackAndShatter() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const impactTime = now + 0.25;

                const sub = this.ctx.createOscillator();
                const subGain = this.ctx.createGain();
                sub.type = 'sine';
                sub.frequency.setValueAtTime(165, impactTime);
                sub.frequency.exponentialRampToValueAtTime(30, impactTime + 0.45);

                subGain.gain.setValueAtTime(0.52, impactTime);
                subGain.gain.exponentialRampToValueAtTime(0.001, impactTime + 0.48);

                sub.connect(subGain);
                subGain.connect(this.ctx.destination);
                sub.start(impactTime);
                sub.stop(impactTime + 0.5);

                const freqs = [1150, 1520, 1920, 980, 2280, 1650, 820];
                freqs.forEach((f, idx) => {
                    const delay = impactTime + 0.02 + idx * 0.042 + Math.random() * 0.025;
                    const shardOsc = this.ctx.createOscillator();
                    const shardGain = this.ctx.createGain();
                    shardOsc.type = idx % 2 === 0 ? 'triangle' : 'sine';
                    shardOsc.frequency.setValueAtTime(f, delay);
                    shardOsc.frequency.exponentialRampToValueAtTime(f * 0.65, delay + 0.12);

                    shardGain.gain.setValueAtTime(0.11 / (1 + idx * 0.25), delay);
                    shardGain.gain.exponentialRampToValueAtTime(0.001, delay + 0.13);

                    shardOsc.connect(shardGain);
                    shardGain.connect(this.ctx.destination);
                    shardOsc.start(delay);
                    shardOsc.stop(delay + 0.14);
                });
            }

            playCathedralBell(isMate = false) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const notes = isMate ? [261.63, 329.63, 392.00, 523.25] : [329.63, 493.88];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.11);

                    gain.gain.setValueAtTime(0.16, now + i * 0.11);
                    gain.gain.exponentialRampToValueAtTime(0.0008, now + i * 0.11 + 1.7);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.11);
                    osc.stop(now + i * 0.11 + 1.75);
                });
            }
        }

        const sound = new SoundEngine();

        /**************************************************************************
         * 2. COMPLETE XIANGQI (CHINESE CHESS) RULES ENGINE & ALPHA-BETA AI
         **************************************************************************/
        const RED = 'r';
        const BLACK = 'b';

        const PIECE_INFO = {
            K: { rName: '帥', bName: '將', value: 10000 },
            A: { rName: '仕', bName: '士', value: 130   },
            E: { rName: '相', bName: '象', value: 130   },
            R: { rName: '俥', bName: '車', value: 600   },
            H: { rName: '傌', bName: '馬', value: 290   },
            C: { rName: '炮', bName: '砲', value: 300   },
            P: { rName: '兵', bName: '卒', value: 80    }
        };

        class XiangqiEngine {
            constructor() {
                this.reset();
            }

            reset() {
                this.board = Array.from({ length: 10 }, () => Array(9).fill(null));
                this.turn = RED;
                this.history = [];
                this.gameOver = false;
                this.winner = null;

                const setupRow = (row, color, types) => {
                    types.forEach((type, col) => {
                        if (type) {
                            this.board[row][col] = {
                                id: `${color}_${type}_${row}_${col}_${Math.random().toString(36).slice(2, 6)}`,
                                type,
                                color
                            };
                        }
                    });
                };

                setupRow(0, BLACK, ['R', 'H', 'E', 'A', 'K', 'A', 'E', 'H', 'R']);
                setupRow(2, BLACK, [null, 'C', null, null, null, null, null, 'C', null]);
                setupRow(3, BLACK, ['P', null, 'P', null, 'P', null, 'P', null, 'P']);

                setupRow(6, RED, ['P', null, 'P', null, 'P', null, 'P', null, 'P']);
                setupRow(7, RED, [null, 'C', null, null, null, null, null, 'C', null]);
                setupRow(9, RED, ['R', 'H', 'E', 'A', 'K', 'A', 'E', 'H', 'R']);
            }

            inBounds(r, c) {
                return r >= 0 && r < 10 && c >= 0 && c < 9;
            }

            inPalace(r, c, color) {
                if (c < 3 || c > 5) return false;
                return color === RED ? (r >= 7 && r <= 9) : (r >= 0 && r <= 2);
            }

            getPseudoMoves(r, c, board = this.board) {
                const piece = board[r][c];
                if (!piece) return [];
                const { type, color } = piece;
                const moves = [];

                const addIfValid = (nr, nc) => {
                    if (!this.inBounds(nr, nc)) return false;
                    const target = board[nr][nc];
                    if (!target || target.color !== color) {
                        moves.push({ fromR: r, fromC: c, toR: nr, toC: nc, captured: target });
                    }
                    return !target;
                };

                if (type === 'K') {
                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (const [dr, dc] of dirs) {
                        const nr = r + dr, nc = c + dc;
                        if (this.inPalace(nr, nc, color)) addIfValid(nr, nc);
                    }
                } else if (type === 'A') {
                    const dirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
                    for (const [dr, dc] of dirs) {
                        const nr = r + dr, nc = c + dc;
                        if (this.inPalace(nr, nc, color)) addIfValid(nr, nc);
                    }
                } else if (type === 'E') {
                    const dirs = [[-2, -2], [-2, 2], [2, -2], [2, 2]];
                    for (const [dr, dc] of dirs) {
                        const nr = r + dr, nc = c + dc;
                        const eyeR = r + dr / 2, eyeC = c + dc / 2;
                        if (!this.inBounds(nr, nc)) continue;
                        if (color === RED && nr < 5) continue;
                        if (color === BLACK && nr > 4) continue;
                        if (board[eyeR][eyeC] === null) addIfValid(nr, nc);
                    }
                } else if (type === 'H') {
                    const jumps = [
                        { leg: [-1, 0], to: [-2, -1] }, { leg: [-1, 0], to: [-2, 1] },
                        { leg: [1, 0],  to: [2, -1] },  { leg: [1, 0],  to: [2, 1] },
                        { leg: [0, -1], to: [-1, -2] }, { leg: [0, -1], to: [1, -2] },
                        { leg: [0, 1],  to: [-1, 2] },  { leg: [0, 1],  to: [1, 2] }
                    ];
                    for (const j of jumps) {
                        const legR = r + j.leg[0], legC = c + j.leg[1];
                        const nr = r + j.to[0], nc = c + j.to[1];
                        if (this.inBounds(nr, nc) && board[legR][legC] === null) {
                            addIfValid(nr, nc);
                        }
                    }
                } else if (type === 'R') {
                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (const [dr, dc] of dirs) {
                        let nr = r + dr, nc = c + dc;
                        while (this.inBounds(nr, nc)) {
                            if (!addIfValid(nr, nc)) break;
                            nr += dr;
                            nc += dc;
                        }
                    }
                } else if (type === 'C') {
                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (const [dr, dc] of dirs) {
                        let nr = r + dr, nc = c + dc;
                        let jumped = false;
                        while (this.inBounds(nr, nc)) {
                            const target = board[nr][nc];
                            if (!jumped) {
                                if (!target) {
                                    moves.push({ fromR: r, fromC: c, toR: nr, toC: nc, captured: null });
                                } else {
                                    jumped = true;
                                }
                            } else {
                                if (target) {
                                    if (target.color !== color) {
                                        moves.push({ fromR: r, fromC: c, toR: nr, toC: nc, captured: target });
                                    }
                                    break;
                                }
                            }
                            nr += dr;
                            nc += dc;
                        }
                    }
                } else if (type === 'P') {
                    const forward = color === RED ? -1 : 1;
                    addIfValid(r + forward, c);
                    const crossedRiver = color === RED ? (r <= 4) : (r >= 5);
                    if (crossedRiver) {
                        addIfValid(r, c - 1);
                        addIfValid(r, c + 1);
                    }
                }

                return moves;
            }

            generalsFacing(board) {
                let rGeneral = null, bGeneral = null;
                for (let r = 0; r < 10; r++) {
                    for (let c = 3; c <= 5; c++) {
                        const p = board[r][c];
                        if (p && p.type === 'K') {
                            if (p.color === RED) rGeneral = { r, c };
                            else bGeneral = { r, c };
                        }
                    }
                }
                if (!rGeneral || !bGeneral || rGeneral.c !== bGeneral.c) return false;
                const col = rGeneral.c;
                for (let r = bGeneral.r + 1; r < rGeneral.r; r++) {
                    if (board[r][col] !== null) return false;
                }
                return true;
            }

            isInCheck(color, board = this.board) {
                if (this.generalsFacing(board)) return true;

                let kingPos = null;
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 9; c++) {
                        const p = board[r][c];
                        if (p && p.color === color && p.type === 'K') {
                            kingPos = { r, c };
                            break;
                        }
                    }
                    if (kingPos) break;
                }
                if (!kingPos) return true;

                const enemy = color === RED ? BLACK : RED;
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 9; c++) {
                        const p = board[r][c];
                        if (p && p.color === enemy) {
                            const moves = this.getPseudoMoves(r, c, board);
                            for (const m of moves) {
                                if (m.toR === kingPos.r && m.toC === kingPos.c) return true;
                            }
                        }
                    }
                }
                return false;
            }

            getLegalMovesForPiece(r, c) {
                const piece = this.board[r][c];
                if (!piece) return [];
                const pseudo = this.getPseudoMoves(r, c, this.board);
                const legal = [];

                for (const m of pseudo) {
                    const savedTarget = this.board[m.toR][m.toC];
                    this.board[m.toR][m.toC] = piece;
                    this.board[m.fromR][m.fromC] = null;

                    const inCheck = this.isInCheck(piece.color, this.board);

                    this.board[m.fromR][m.fromC] = piece;
                    this.board[m.toR][m.toC] = savedTarget;

                    if (!inCheck) legal.push(m);
                }
                return legal;
            }

            getAllLegalMoves(color) {
                const all = [];
                for (let r = 0; r < 10; r++) {
                    for (let c = 0; c < 9; c++) {
                        const p = this.board[r][c];
                        if (p && p.color === color) {
                            all.push(...this.getLegalMovesForPiece(r, c));
                        }
                    }
                }
                return all;
            }

            makeMove(move) {
                const piece = this.board[move.fromR][move.fromC];
                const captured = this.board[move.toR][move.toC];

                this.history.push({
                    fromR: move.fromR,
                    fromC: move.fromC,
                    toR: move.toR,
                    toC: move.toC,
                    piece,
                    captured,
                    prevTurn: this.turn
                });
